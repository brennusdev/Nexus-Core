databases:
  - name: nexus-core-db
    databaseName: nexus_core
    user: nexus_core
    plan: free
    postgresVersion: "17"

services:
  - type: web
    name: nexus-core-api
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn App.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-core-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: https://nexus-core-sepia.vercel.app
