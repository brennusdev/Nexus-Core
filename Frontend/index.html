<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexus Core - Plataforma de acesso unificado" />

    <title>Nexus Core | Login</title>

    <!-- CSS principal -->
    <link rel="stylesheet" href="cores.css" />
</head>

<body class="login-bg">
    <button class="login-theme-toggle" id="themeToggle" title="Alternar modo escuro" aria-label="Alternar tema">🌙</button>
    <main class="login-container">

        <!-- ===================== BRAND (sem foto) ===================== -->
        <div class="login-brand" aria-hidden="true">
            <div class="login-brand__mark">
                <span></span><span></span><span></span><span></span>
            </div>
            <h1 class="login-brand__title">Nexus&nbsp;<em>Core</em></h1>
        </div>

        <!-- ===================== CARD DE ACESSO ===================== -->
        <section class="card login-card" aria-label="Autenticação">

            <header class="login-card__head">
                <h2 class="login-card__title">Bem-vindo de volta</h2>
                <p class="login-card__subtitle">Acesse sua plataforma unificada</p>
            </header>

            <!-- Tabs: Entrar | Cadastrar -->
            <div class="auth-tabs" role="tablist">
                <button
                    type="button"
                    class="auth-tabs__tab auth-tabs__tab--active"
                    id="tab-login"
                    role="tab"
                    aria-selected="true"
                    aria-controls="panel-login"
                    data-tab="login"
                >Entrar</button>
                <button
                    type="button"
                    class="auth-tabs__tab"
                    id="tab-register"
                    role="tab"
                    aria-selected="false"
                    aria-controls="panel-register"
                    data-tab="register"
                >Cadastrar</button>
            </div>

            <!-- ===== Form LOGIN ===== -->
            <form class="auth-form" id="panel-login" role="tabpanel" data-form="login" novalidate>
                <div class="form-field">
                    <label class="form-field__label" for="login-email">E-mail</label>
                    <input
                        class="form-field__input"
                        type="email"
                        id="login-email"
                        name="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    />
                    <span class="form-field__error" data-error="login-email"></span>
                </div>

                <div class="form-field">
                    <label class="form-field__label" for="login-password">Senha</label>
                    <input
                        class="form-field__input"
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        minlength="6"
                        required
                    />
                    <span class="form-field__error" data-error="login-password"></span>
                    <div class="form-field__row">
                        <label class="checkbox">
                            <input type="checkbox" name="remember" />
                            <span>Lembrar de mim</span>
                        </label>
                        <a href="#" class="auth-form__link">Esqueceu a senha?</a>
                    </div>
                </div>

                <button type="submit" class="btn btn--primary btn--block">Entrar no Nexus Core</button>
            </form>

            <!-- ===== Form CADASTRO ===== -->
            <form class="auth-form" id="panel-register" role="tabpanel" data-form="register" hidden novalidate>
                <div class="form-field">
                    <label class="form-field__label" for="reg-name">Nome completo</label>
                    <input
                        class="form-field__input"
                        type="text"
                        id="reg-name"
                        name="name"
                        placeholder="BlackCode"
                        autocomplete="name"
                        minlength="3"
                        required
                    />
                    <span class="form-field__error" data-error="reg-name"></span>
                </div>

                <div class="form-field">
                    <label class="form-field__label" for="reg-email">E-mail</label>
                    <input
                        class="form-field__input"
                        type="email"
                        id="reg-email"
                        name="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    />
                    <span class="form-field__error" data-error="reg-email"></span>
                </div>

                <div class="form-field">
                    <label class="form-field__label" for="reg-password">Senha</label>
                    <input
                        class="form-field__input"
                        type="password"
                        id="reg-password"
                        name="password"
                        placeholder="Mínimo 6 caracteres"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    />
                    <span class="form-field__error" data-error="reg-password"></span>
                </div>

                <div class="form-field">
                    <label class="form-field__label" for="reg-confirm">Confirmar senha</label>
                    <input
                        class="form-field__input"
                        type="password"
                        id="reg-confirm"
                        name="confirm"
                        placeholder="Repita a senha"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    />
                    <span class="form-field__error" data-error="reg-confirm"></span>
                </div>

                <button type="submit" class="btn btn--primary btn--block">Criar minha conta</button>
            </form>

            <div class="loader" id="loader" hidden aria-hidden="true"></div>
        </section>

        <p class="login-footer">
            &copy; <span id="year"></span> Nexus Core &mdash; Todos os direitos reservados.
        </p>
    </main>

    <script src="js/app.js" defer></script>
</body>
</html>
