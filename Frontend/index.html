<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexus Core - Plataforma de acesso unificado" />

    <title>Nexus Core | Acesso</title>

    <!-- CSS principal -->
    <link rel="stylesheet" href="cores.css" />
</head>

<body>
    <main class="auth-container">

        <!-- ===================== LOGO ===================== -->
        <section class="auth-logo" aria-label="Identificação do produto">
            <img
                src="../imagens/nexus.png"
                alt="Logo Nexus Core"
                class="auth-logo__img"
                onerror="this.style.display='none'"
            />
            <h1 class="auth-logo__title">Nexus <span>Core</span></h1>
            <p class="auth-logo__subtitle">Acesso unificado à sua plataforma</p>
        </section>

        <!-- ===================== CAIXA DE ACESSO ===================== -->
        <section class="card auth-card" aria-label="Formulário de autenticação">

            <!-- Tabs: Login | Cadastro -->
            <div class="auth-tabs" role="tablist">
                <button
                    type="button"
                    class="auth-tabs__tab auth-tabs__tab--active"
                    id="tab-login"
                    role="tab"
                    aria-selected="true"
                    aria-controls="panel-login"
                    data-tab="login"
                >Entrar</button>
                <button
                    type="button"
                    class="auth-tabs__tab"
                    id="tab-register"
                    role="tab"
                    aria-selected="false"
                    aria-controls="panel-register"
                    data-tab="register"
                >Cadastrar</button>
            </div>

            <!-- ===== Formulário de LOGIN ===== -->
            <form class="auth-form" id="panel-login" role="tabpanel" data-form="login" novalidate>
                <div class="form-field">
                    <label class="form-field__label" for="login-email">E-mail</label>
                    <input
                        class="form-field__input"
                        type="email"
                        id="login-email"
                        name="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    />
                    <span class="form-field__error" data-error="login-email"></span>
                </div>

                <div class="form-field">
                    <label class="form-field__label" for="login-password">Senha</label>
                    <input
                        class="form-field__input"
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        minlength="6"
                        required
                    />
                    <span class="form-field__error" data-error="login-password"></span>
                </div>

                <button type="submit" class="btn btn--primary btn--block">
                    Entrar no Nexus Core
                </button>

                <p class="auth-form__footer">
                    Esqueceu a senha? <a href="#" class="auth-form__link">Recuperar</a>
                </p>
            </form>

            <!-- ===== Formulário de CADASTRO ===== -->
            <form class="auth-form" id="panel-register" role="tabpanel" data-form="register" hidden novalidate>
                <div class="form-field">
                    <label class="form-field__label" for="reg-name">Nome completo</label>
                    <input
                        class="form-field__input"
                        type="text"
                        id="reg-name"
                        name="name"
                        placeholder="Maria da Silva"
                        autocomplete="name"
                        minlength="3"
                        required
                    />
                    <span class="form-field__error" data-error="reg-name"></span>
                </div>

                <div class="form-field">
                    <label class="form-field__label" for="reg-email">E-mail</label>
                    <input
                        class="form-field__input"
                        type="email"
                        id="reg-email"
                        name="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    />
                    <span class="form-field__error" data-error="reg-email"></span>
                </div>

                <div class="form-field">
                    <label class="form-field__label" for="reg-password">Senha</label>
                    <input
                        class="form-field__input"
                        type="password"
                        id="reg-password"
                        name="password"
                        placeholder="Mínimo 6 caracteres"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    />
                    <span class="form-field__error" data-error="reg-password"></span>
                </div>

                <div class="form-field">
                    <label class="form-field__label" for="reg-confirm">Confirmar senha</label>
                    <input
                        class="form-field__input"
                        type="password"
                        id="reg-confirm"
                        name="confirm"
                        placeholder="Repita a senha"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    />
                    <span class="form-field__error" data-error="reg-confirm"></span>
                </div>

                <button type="submit" class="btn btn--primary btn--block">
                    Criar minha conta
                </button>

                <p class="auth-form__footer">
                    Já tem conta? <a href="#" class="auth-form__link" data-switch="login">Entrar</a>
                </p>
            </form>

            <!-- Loader de carregamento -->
            <div class="loader" id="loader" hidden aria-hidden="true"></div>
        </section>

        <footer class="auth-footer">
            <p>&copy; <span id="year"></span> Nexus Core. Todos os direitos reservados.</p>
        </footer>
    </main>

    <!-- JavaScript -->
    <script src="js/app.js" defer></script>
</body>
</html>
