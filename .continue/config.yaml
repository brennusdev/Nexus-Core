name: Nexus Core - OmniRoute
version: 1.0.0
schema: v1

models:
  - name: OmniRoute Auto
    provider: openai
    model: auto/best-chat
    apiBase: http://localhost:20128/v1
    apiKey: ${{ secrets.OMNIROUTE_API_KEY }}
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 120000
      maxTokens: 4096
    requestOptions:
      timeout: 120000