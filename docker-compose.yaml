# ====================================================================
# CORRECAO: docker-compose.yaml - Movido para a RAIZ do projeto
# MOTIVO: O arquivo original estava DENTRO de uma pasta "docker-compose/"
#         com o nome "yaml" (sem extensao). Docker-compose so reconhece
#         arquivos com o nome "docker-compose.yaml" ou "docker-compose.yml"
#         na raiz do projeto ou via flag -f.
#
#         MUDANCA ADICIONAL: O build agora aponta para ./Backend (pasta correta)
#         em vez de ./backend (que nao existe).
# ====================================================================
version: "3.9"

services:

  backend:
    # CORRECAO: "build: ./backend" -> "build: ./Backend"
    # MOTIVO: A pasta se chama "Backend" (maiusculo), nao "backend" (minusculo).
    #         No Linux (onde o Docker roda), isso e case-sensitive!
    build: ./Backend
    container_name: nexus_backend

    ports:
      - "8000:8000"

    env_file:
      - ./Backend/.env

    depends_on:
      - db

  db:
    image: postgres:17
    container_name: nexus_postgres
    restart: always

    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
